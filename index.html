<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Feliz cumpleaños, Mily 🌹</title>
    <meta
      name="description"
      content="Una película de cumpleaños en cuatro actos: una rosa que despierta con un toque, una explosión de color, un deseo animado y un árbol coronado de rosas."
    />
    <meta name="author" content="Vivek Kumar" />
    <meta name="copyright" content="Vivek Kumar" />
    <meta name="theme-color" content="#f7e7dc" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap"
      rel="stylesheet"
    />

    <script>
      document.documentElement.classList.add("js");
    </script>
    <link rel="stylesheet" href="./birthday.css?v=1.0.3" />
  </head>
  <body>
    <main class="scene">
      <!-- The tree world (Act 4). One canvas; it stays transparent until the
         intro hands off, then it draws its own warm sky + blossom tree. -->
      <canvas
        id="tree"
        class="tree"
        aria-label="Un árbol florece hasta formar una copa de rosas"
        role="img"
      ></canvas>

      <!-- ACT 1 — THE INVITATION ------------------------------------------------
         A single rose on a warm field. It is the only thing the
         visitor has to do: tap it. Real <button> so it is tappable + keyboard
         focusable; everything decorative around it is aria-hidden. -->
      <section
        class="hero"
        id="hero"
        aria-label="Toca la rosa o tira del arco para abrir tu tarjeta"
      >
        <div class="hero__bg" aria-hidden="true"></div>
        <div class="hero__motes" id="motes" aria-hidden="true"></div>

        <p class="hero__eyebrow" id="eyebrow">Un pequeño detalle para ti</p>

        <!-- THE TARGET — the rose the arrow flies to (GSAP animates .target) -->
        <div class="targetWrap" aria-hidden="true">
          <div class="target" id="target">
            <span class="heart__glow" aria-hidden="true"></span>
            <span class="target__heart" id="targetHeart">
              <svg class="heart__svg" viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                  <radialGradient id="rosePetal" cx="34%" cy="25%" r="82%">
                    <stop offset="0%" stop-color="#ffe4e8" />
                    <stop offset="40%" stop-color="#ff7891" />
                    <stop offset="78%" stop-color="#dc2855" />
                    <stop offset="100%" stop-color="#8d1238" />
                  </radialGradient>
                  <radialGradient id="roseInner" cx="35%" cy="25%" r="90%">
                    <stop offset="0%" stop-color="#ffd0d8" />
                    <stop offset="55%" stop-color="#ed456c" />
                    <stop offset="100%" stop-color="#a90e40" />
                  </radialGradient>
                  <linearGradient id="roseLeaf" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#a5bd68" />
                    <stop offset="100%" stop-color="#426744" />
                  </linearGradient>
                </defs>
                <path
                  d="M47 75C37 83 21 79 21 68c-10-7-8-20 1-25-3-12 8-20 18-14 5-11 20-11 25-1 12-4 22 6 18 17 10 8 7 21-4 25-2 12-17 16-28 7Z"
                  fill="url(#roseLeaf)"
                />
                <path
                  d="M50 78C33 77 17 67 15 52c-2-12 6-21 17-22 0-12 11-18 20-11 9-9 22-4 23 7 13 3 17 16 9 25 3 13-9 26-23 27Z"
                  fill="url(#rosePetal)"
                />
                <path
                  d="M27 58C20 48 26 37 37 38c4-10 15-11 20-3 9-5 18 1 16 11 9 7 4 19-6 20-5 9-18 8-22 0-10 2-17-1-18-8Z"
                  fill="url(#roseInner)"
                />
                <path
                  d="M38 61C34 52 40 45 48 47c5-7 14-4 14 4 7 4 6 13-2 15-6 7-15 3-16-2-4 1-7 0-6-3Z"
                  fill="url(#rosePetal)"
                />
                <path
                  d="M49 58c-3-5 1-10 6-8 5-3 9 2 6 6 1 5-5 8-9 5-4 1-6-1-3-3Z"
                  fill="#a81542"
                />
                <path
                  d="M52 56c3-4 8-2 7 2-1 3-5 4-7 2"
                  fill="none"
                  stroke="#ffb4bd"
                  stroke-width="2.2"
                  stroke-linecap="round"
                />
                <ellipse
                  cx="35"
                  cy="34"
                  rx="5"
                  ry="3"
                  fill="#fff"
                  opacity=".6"
                  transform="rotate(-30 35 34)"
                />
              </svg>
            </span>
          </div>
        </div>

        <!-- THE BOW + ARROW — draw the string back, release to fire. The rig is
           placed lower-left and rotated by JS to aim at the rose, so the shot
           travels on a diagonal. A real control: role=button + keyboard drag. -->
        <div
          class="archery"
          id="archery"
          role="button"
          tabindex="0"
          aria-label="Tira de la cuerda y suéltala para lanzar la flecha hacia la rosa"
        >
          <!-- aim line, inside the rig so it points straight at the rose -->
          <div class="aim" id="aim" aria-hidden="true"></div>

          <!-- realistic recurve bow: wooden limbs, leather grip, a live string -->
          <svg class="bow" id="bow" viewBox="0 0 460 300" aria-hidden="true">
            <defs>
              <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#4a2a1a" />
                <stop offset=".18" stop-color="#6b3f24" />
                <stop offset=".5" stop-color="#8a5127" />
                <stop offset=".82" stop-color="#6b3f24" />
                <stop offset="1" stop-color="#4a2a1a" />
              </linearGradient>
              <linearGradient id="limbHi" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="rgba(255,214,160,.8)" />
                <stop offset="1" stop-color="rgba(255,214,160,0)" />
              </linearGradient>
              <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#2a1a10" />
                <stop offset=".5" stop-color="#5a3822" />
                <stop offset="1" stop-color="#2a1a10" />
              </linearGradient>
            </defs>
            <!-- limb body (taper faked with two stacked strokes) -->
            <path
              class="bow__limb"
              d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96"
              fill="none"
              stroke="url(#limb)"
              stroke-width="13"
              stroke-linecap="round"
            />
            <path
              class="bow__limbHi"
              d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96"
              fill="none"
              stroke="url(#limbHi)"
              stroke-width="3"
              stroke-linecap="round"
              opacity=".7"
            />
            <!-- recurve tip hooks -->
            <path
              d="M34 96 C 22 82, 26 70, 40 66"
              fill="none"
              stroke="url(#limb)"
              stroke-width="8"
              stroke-linecap="round"
            />
            <path
              d="M426 96 C 438 82, 434 70, 420 66"
              fill="none"
              stroke="url(#limb)"
              stroke-width="8"
              stroke-linecap="round"
            />
            <!-- leather grip over the belly -->
            <rect
              x="216"
              y="206"
              width="28"
              height="70"
              rx="9"
              fill="url(#grip)"
            />
            <path
              d="M219 220h22 M219 236h22 M219 252h22"
              stroke="rgba(0,0,0,.35)"
              stroke-width="2"
            />
            <!-- the string: two segments meeting at the nock (JS animates the nock).
                 A warm taupe so the taut string actually reads against the cream. -->
            <line
              class="bow__str"
              id="strL"
              x1="40"
              y1="70"
              x2="230"
              y2="96"
              stroke="#9a8068"
              stroke-width="2.2"
              stroke-linecap="round"
            />
            <line
              class="bow__str"
              id="strR"
              x1="420"
              y1="70"
              x2="230"
              y2="96"
              stroke="#9a8068"
              stroke-width="2.2"
              stroke-linecap="round"
            />
            <circle
              class="bow__serving"
              id="serving"
              cx="230"
              cy="96"
              r="4.5"
              fill="#6f5137"
            />
          </svg>

          <!-- the arrow: winged golden rose tip, gold feather fletching -->
          <svg class="arrow" id="arrow" viewBox="0 0 64 220" aria-hidden="true">
            <defs>
              <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#4a2c14" />
                <stop offset=".5" stop-color="#8a5a2c" />
                <stop offset="1" stop-color="#3e2410" />
              </linearGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffe38c" />
                <stop offset=".45" stop-color="#f4a626" />
                <stop offset="1" stop-color="#a85f0e" />
              </linearGradient>
              <linearGradient id="feath" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff7f9c" />
                <stop offset=".5" stop-color="#e6396a" />
                <stop offset="1" stop-color="#a8154a" />
              </linearGradient>
              <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" />
                <stop offset="1" stop-color="#ffe0c4" />
              </linearGradient>
            </defs>

            <!-- shaft (dark wood so it reads against the cream) -->
            <rect
              x="29.4"
              y="30"
              width="5.2"
              height="168"
              rx="2.6"
              fill="url(#shaft)"
            />

            <!-- angel wings flanking the rose tip -->
            <g class="arrow__wings">
              <path
                class="wingL"
                d="M31 30 C 10 16, 2 20, 4 34 C 12 30, 20 32, 31 40 Z"
                fill="url(#wing)"
                stroke="rgba(196,132,58,.72)"
                stroke-width="1.2"
              />
              <path
                class="wingR"
                d="M33 30 C 54 16, 62 20, 60 34 C 52 30, 44 32, 33 40 Z"
                fill="url(#wing)"
                stroke="rgba(196,132,58,.72)"
                stroke-width="1.2"
              />
            </g>

            <!-- golden rose arrowhead -->
            <path
              class="arrow__head"
              d="M32 27C24 26 19 21 20 15c1-5 6-7 10-4 0-6 8-7 11-2 5-2 9 3 7 8-1 6-7 10-16 10Z"
              fill="url(#gold)"
              stroke="#a5701a"
              stroke-width=".8"
            />
            <path
              d="M31 22c-4-3-2-7 1-7 2-4 7-2 6 1 4 2 2 6-2 7-2 2-5 1-5-1Z"
              fill="#ffe38c"
              stroke="#c27a1b"
              stroke-width=".7"
            />
            <path
              d="M29 24l-4 4 7-2m4-1 4 3-1-6"
              fill="#66854b"
              stroke="#48663f"
              stroke-width=".8"
              stroke-linejoin="round"
            />

            <!-- gold feather fletching -->
            <g class="arrow__fletch">
              <path
                d="M32 150 C 16 156, 10 178, 15 200 C 24 194, 30 184, 32 176 Z"
                fill="url(#feath)"
              />
              <path
                d="M32 150 C 48 156, 54 178, 49 200 C 40 194, 34 184, 32 176 Z"
                fill="url(#feath)"
                opacity=".92"
              />
              <path
                d="M28 160l4 3 M26 170l6 3 M25 180l7 3"
                stroke="rgba(130,12,48,.45)"
                stroke-width="1"
              />
              <path
                d="M36 160l-4 3 M38 170l-6 3 M39 180l-7 3"
                stroke="rgba(130,12,48,.45)"
                stroke-width="1"
              />
            </g>
            <!-- nock -->
            <path
              d="M29 200 L32 205 L35 200"
              fill="none"
              stroke="#c9a25a"
              stroke-width="2"
              stroke-linecap="round"
            />
            <!-- invisible tip marker: JS measures it to land the head on the rose -->
            <circle id="tip" cx="32" cy="9" r="0.6" fill="none" />
          </svg>
        </div>

        <p class="hero__hint" id="hint">Tira y suelta</p>
      </section>

      <!-- ACT 2 — THE FLOOD -----------------------------------------------------
         The rose bursts into this circle at its landing point, and it swallows
         the frame in rose. Same trick as the intro dot: no cross-fade anywhere,
         the colour just arrives. -->
      <div class="flood" id="flood" aria-hidden="true"></div>

      <!-- ACT 3 — THE WISH (kinetic type on the flood) --------------------------
         Lives inside the flood's own colour, revealed by it. Every glyph hinges
         up out of its mask — nothing fades. -->
      <div class="field" id="field" aria-hidden="true">
        <div class="blob blob--1"></div>
        <div class="blob blob--2"></div>
        <div class="blob blob--3"></div>
        <div class="fgrid" id="fgrid"></div>
        <div class="fvignette"></div>

        <div class="camera" id="camera">
          <p class="kEyebrow" id="kEyebrow">Pide un deseo&hellip;</p>
          <h2 class="headline" id="headline">
            <span class="hl__line"
              ><span class="mask"
                ><span class="hl__word" id="wLine1">Feliz</span></span
              ></span
            >
            <span class="hl__line"
              ><span class="mask"
                ><span class="hl__word" id="wLine2">Cumpleaños</span></span
              ></span
            >
          </h2>
          <svg
            class="uline"
            id="uline"
            viewBox="0 0 300 26"
            fill="none"
            aria-hidden="true"
          >
            <path
              class="uline__path"
              d="M8 16C56 7 132 4 178 6c30 1 78 5 114 12-40 3-108 4-176 3"
              stroke="currentColor"
              stroke-width="3.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <p class="kSub" id="kSub">Para alguien que merece todo lo bueno</p>
        </div>

        <div class="bar bar--top" id="barTop"></div>
        <div class="bar bar--bot" id="barBot"></div>
      </div>

      <!-- The gold light that bridges the rose wish into the dawn of the tree. -->
      <div class="bloom" id="bloom" aria-hidden="true"></div>

      <!-- ACT 4 — THE HAND-LETTERED WISH (over the tree) ------------------------ -->
      <div class="wish" id="wish" aria-hidden="true">
        <p class="wish__eyebrow" id="wEyebrow">Y ahora&hellip; que se cumpla</p>
        <div class="wish__heroWrap">
          <h1 class="wish__hero" id="wHero">Feliz cumpleaños, Mily</h1>
        </div>
        <span class="wish__rule" id="wRule"></span>
        <p class="wish__sub" id="wSub">Que este año florezca con alegría</p>
      </div>

      <!-- Play the film again once it has settled. -->
      <button class="replay" id="replay" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" width="15" height="15">
          <path
            d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"
            fill="currentColor"
          />
        </svg>
        Otra vez
      </button>

      <!-- Music / Sound Toggle -->
      <button
        class="music-toggle"
        id="musicToggle"
        type="button"
        aria-label="Activar o desactivar el sonido"
      >
        <svg
          class="icon-sound-on"
          viewBox="0 0 24 24"
          aria-hidden="true"
          width="15"
          height="15"
        >
          <path
            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
            fill="currentColor"
          />
        </svg>
        <svg
          class="icon-sound-off"
          viewBox="0 0 24 24"
          aria-hidden="true"
          width="15"
          height="15"
          style="display: none"
        >
          <path
            d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"
            fill="currentColor"
          />
        </svg>
        <span class="music-toggle__label">Sonido</span>
      </button>

      <!-- One lens over the whole film: vignette + fine grain. -->
      <div class="grade" aria-hidden="true">
        <div class="grade__vignette"></div>
        <div class="grade__grain"></div>
      </div>
    </main>

    <!-- Accessible equivalent for reduced-motion + screen readers. -->
    <p class="sr-only">Feliz cumpleaños, Mily. Que tengas un año maravilloso.</p>

    <script type="module" src="./birthday.js?v=1.0.3"></script>
  </body>
</html>
